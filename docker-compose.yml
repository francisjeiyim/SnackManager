services:
  postgres:
    image: postgres:16-alpine
    container_name: snackmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snackmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snackmanager}
      POSTGRES_DB: ${POSTGRES_DB:-snackmanager}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snackmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: snackmanager-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
