# SnackManager — edge nginx for the `web` container.
# Serves the built SPA and reverse-proxies the API + Socket.IO to `server:4100`.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 15m;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json application/wasm;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- REST API -> NestJS ---------------------------------------------
    location /api/ {
      proxy_pass http://server:4100;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_read_timeout 120s;
    }

    # --- Socket.IO (WebSocket) -> NestJS ------------------------------
    location /socket.io/ {
      proxy_pass http://server:4100;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }

    # --- PWA shell: never cache -------------------------------------
    location = /index.html          { add_header Cache-Control "no-cache"; }
    location = /sw.js               { add_header Cache-Control "no-cache"; }
    location = /registerSW.js       { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # --- fingerprinted assets: cache hard ----------------------------
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # --- SPA fallback --------------------------------------------------
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
